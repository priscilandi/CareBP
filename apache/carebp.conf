# LAMP virtual host for a project installed at /var/www/carebp.
# Only frontend/ and backend/api/ are served; .env, schema and internals stay private.
# Requires Apache + mod_php (libapache2-mod-php) or equivalent PHP handler.
<VirtualHost *:80>
    ServerName carebp.local
    DocumentRoot /var/www/carebp/frontend
    DirectoryIndex index.html

    <Directory /var/www/carebp/frontend>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api/ /var/www/carebp/backend/api/
    <Directory /var/www/carebp/backend/api>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        <FilesMatch "^(?!categories|education|facilities|health|location-types|recommendations)[^/]+\.php$">
            Require all denied
        </FilesMatch>
        <FilesMatch "\.(?!php$)[^/]+$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/carebp-error.log
    CustomLog ${APACHE_LOG_DIR}/carebp-access.log combined
</VirtualHost>
