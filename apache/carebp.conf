# CareBP Apache virtual host (local development)
# Project installed at /var/www/carebp.
# Keep database credentials and PHP internals outside the public web root.
<VirtualHost *:80>
    ServerName carebp.local
    DocumentRoot /var/www/carebp/frontend
    DirectoryIndex index.html

    <Directory /var/www/carebp/frontend>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api/ /var/www/carebp/backend/api/
    <Directory /var/www/carebp/backend/api>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        <FilesMatch "^(?!categories|education|facilities|health|location-types|recommendations)[^/]+\.php$">
            Require all denied
        </FilesMatch>
        <FilesMatch "\.(?!php$)[^/]+$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Only named admin PHP pages are URL-accessible. Do not alias /admin/ wholesale:
    # internal helpers such as admin_helpers.php must remain private.
    RedirectMatch 302 ^/admin/?$ /admin/index.php
    AliasMatch "^/admin/(index|facilities|add|edit|remove|recommendations|approvals|audit-log|login|logout)\.php$" "/var/www/carebp/backend/admin/$1.php"
    <Directory /var/www/carebp/backend/admin>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/carebp-error.log
    CustomLog ${APACHE_LOG_DIR}/carebp-access.log combined
</VirtualHost>
